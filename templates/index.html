<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>我的课表</title>
<style>
:root {
  --bg: #0f0f13;
  --card: #1a1a24;
  --border: #2a2a3a;
  --text: #e8e8f0;
  --text-dim: #8888a0;
  --accent: #6c5ce7;
  --accent-light: #a29bfe;
  --mon: #fd79a8;
  --tue: #00cec9;
  --wed: #fdcb6e;
  --thu: #74b9ff;
  --fri: #55efc4;
  --sat: #e17055;
  --sun: #dfe6e9;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: -apple-system, "SF Pro", "Helvetica Neue", sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100dvh;
  overflow-x: hidden;
}

.login-page {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 100dvh;
  padding: 24px;
}
.login-page.hidden { display: none; }
.login-logo {
  font-size: 48px;
  margin-bottom: 8px;
}
.login-title {
  font-size: 22px;
  font-weight: 700;
  margin-bottom: 4px;
}
.login-sub {
  font-size: 13px;
  color: var(--text-dim);
  margin-bottom: 32px;
}
.login-form {
  width: 100%;
  max-width: 340px;
}
.input-group {
  margin-bottom: 16px;
}
.input-group label {
  display: block;
  font-size: 12px;
  color: var(--text-dim);
  margin-bottom: 6px;
  text-transform: uppercase;
  letter-spacing: 1px;
}
.input-group input {
  width: 100%;
  padding: 14px 16px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  color: var(--text);
  font-size: 16px;
  outline: none;
  transition: border-color 0.2s;
}
.input-group input:focus {
  border-color: var(--accent);
}
.login-btn {
  width: 100%;
  padding: 14px;
  background: var(--accent);
  border: none;
  border-radius: 12px;
  color: #fff;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  margin-top: 8px;
  transition: opacity 0.2s;
}
.login-btn:active { opacity: 0.7; }
.login-btn:disabled { opacity: 0.4; }
.login-error {
  color: #ff6b6b;
  font-size: 13px;
  text-align: center;
  margin-top: 12px;
  min-height: 20px;
}

.schedule-page {
  padding: 0 0 24px;
}
.schedule-page.hidden { display: none; }

.top-bar {
  position: sticky;
  top: 0;
  z-index: 100;
  background: rgba(15,15,19,0.85);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  padding: 12px 16px 0;
}
.top-bar h1 {
  font-size: 20px;
  font-weight: 700;
  margin-bottom: 12px;
}
.week-nav {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  padding-bottom: 12px;
  -webkit-overflow-scrolling: touch;
}
.week-nav::-webkit-scrollbar { display: none; }
.week-btn {
  flex-shrink: 0;
  padding: 6px 14px;
  border-radius: 20px;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--text-dim);
  font-size: 13px;
  cursor: pointer;
  transition: all 0.2s;
}
.week-btn.active {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
  font-weight: 600;
}

.schedule-grid {
  padding: 8px 10px;
}
.time-label {
  font-size: 10px;
  color: var(--text-dim);
  text-align: center;
  padding: 6px 0 2px;
  border-bottom: 1px solid var(--border);
}
.day-header {
  display: grid;
  grid-template-columns: 44px repeat(7, 1fr);
  gap: 3px;
  margin-bottom: 4px;
}
.day-header span {
  text-align: center;
  font-size: 12px;
  font-weight: 600;
  padding: 8px 0;
  color: var(--text-dim);
}
.day-header span.today {
  color: var(--accent-light);
}
.day-header .corner { font-size: 10px; }

.period-section {
  margin-bottom: 6px;
}
.period-label {
  font-size: 11px;
  color: var(--text-dim);
  padding: 4px 0 4px 4px;
  opacity: 0.7;
}
.slot-row {
  display: grid;
  grid-template-columns: 44px repeat(7, 1fr);
  gap: 3px;
  min-height: 52px;
  margin-bottom: 3px;
}
.slot-time {
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 9px;
  color: var(--text-dim);
  writing-mode: vertical-lr;
  text-orientation: mixed;
}
.course-cell {
  border-radius: 8px;
  padding: 4px 3px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  min-height: 52px;
  transition: transform 0.15s;
  cursor: pointer;
  position: relative;
  overflow: hidden;
}
.course-cell:active { transform: scale(0.95); }
.course-cell.empty {
  background: rgba(255,255,255,0.02);
  border: 1px dashed rgba(255,255,255,0.05);
}
.course-cell .course-name {
  font-size: 10px;
  font-weight: 600;
  line-height: 1.2;
  margin-bottom: 2px;
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.course-cell .course-room {
  font-size: 9px;
  opacity: 0.7;
}
.course-cell.c0 { background: rgba(253,121,168,0.15); color: var(--mon); border: 1px solid rgba(253,121,168,0.2); }
.course-cell.c1 { background: rgba(0,206,201,0.15); color: var(--tue); border: 1px solid rgba(0,206,201,0.2); }
.course-cell.c2 { background: rgba(253,203,110,0.15); color: var(--wed); border: 1px solid rgba(253,203,110,0.2); }
.course-cell.c3 { background: rgba(116,185,255,0.15); color: var(--thu); border: 1px solid rgba(116,185,255,0.2); }
.course-cell.c4 { background: rgba(85,239,196,0.15); color: var(--fri); border: 1px solid rgba(85,239,196,0.2); }
.course-cell.c5 { background: rgba(225,112,85,0.15); color: var(--sat); border: 1px solid rgba(225,112,85,0.2); }

.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.6);
  z-index: 200;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s;
}
.modal-overlay.show {
  opacity: 1;
  pointer-events: auto;
}
.modal-sheet {
  background: var(--card);
  border-radius: 20px 20px 0 0;
  width: 100%;
  max-width: 420px;
  padding: 24px;
  transform: translateY(100%);
  transition: transform 0.3s cubic-bezier(0.32,0.72,0,1);
}
.modal-overlay.show .modal-sheet {
  transform: translateY(0);
}
.modal-handle {
  width: 36px;
  height: 4px;
  background: var(--border);
  border-radius: 2px;
  margin: 0 auto 16px;
}
.modal-course-name {
  font-size: 20px;
  font-weight: 700;
  margin-bottom: 16px;
}
.modal-info {
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.modal-row {
  display: flex;
  align-items: center;
  gap: 12px;
}
.modal-icon {
  width: 36px;
  height: 36px;
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  flex-shrink: 0;
}
.modal-label {
  font-size: 12px;
  color: var(--text-dim);
}
.modal-value {
  font-size: 15px;
  font-weight: 500;
}

.empty-state {
  text-align: center;
  padding: 60px 24px;
  color: var(--text-dim);
}
.empty-state .emoji { font-size: 48px; margin-bottom: 12px; }
.empty-state p { font-size: 14px; }

.loading {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 40px;
  gap: 8px;
  color: var(--text-dim);
  font-size: 14px;
}
.spinner {
  width: 20px; height: 20px;
  border: 2px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

.logout-btn {
  position: fixed;
  top: 12px;
  right: 16px;
  z-index: 101;
  background: rgba(255,255,255,0.08);
  border: none;
  border-radius: 8px;
  color: var(--text-dim);
  font-size: 12px;
  padding: 6px 12px;
  cursor: pointer;
}
</style>
</head>
<body>

<div class="login-page" id="loginPage">
  <div class="login-logo">📅</div>
  <div class="login-title">我的课表</div>
  <div class="login-sub">安徽建筑大学 · 研究生系统</div>
  <div class="login-form">
    <div class="input-group">
      <label>学号</label>
      <input type="text" id="username" placeholder="请输入学号" autocomplete="username">
    </div>
    <div class="input-group">
      <label>密码</label>
      <input type="password" id="password" placeholder="请输入密码" autocomplete="current-password">
    </div>
    <button class="login-btn" id="loginBtn" onclick="doLogin()">登 录</button>
    <div class="login-error" id="loginError"></div>
  </div>
</div>

<div class="schedule-page hidden" id="schedulePage">
  <div class="top-bar">
    <h1>📚 本周课表</h1>
    <div class="week-nav" id="weekNav"></div>
  </div>
  <button class="logout-btn" onclick="doLogout()">退出</button>
  <div id="scheduleContent">
    <div class="loading"><div class="spinner"></div>加载中...</div>
  </div>
</div>

<div class="modal-overlay" id="modal" onclick="closeModal(event)">
  <div class="modal-sheet" onclick="event.stopPropagation()">
    <div class="modal-handle"></div>
    <div class="modal-course-name" id="modalName"></div>
    <div class="modal-info" id="modalInfo"></div>
  </div>
</div>

<script>
const COLORS = ['c0','c1','c2','c3','c4','c5'];
const DAYS = ['周一','周二','周三','周四','周五','周六','周日'];
const SLOT_TIMES = {
  41:'8:00', 42:'8:45', 43:'9:30', 44:'10:15',
  46:'11:00', 49:'14:00', 50:'14:45', 51:'15:30',
  52:'16:15', 56:'19:00', 57:'19:45', 58:'20:30'
};

let allCourses = [];
let courseColorMap = {};

async function doLogin() {
  const btn = document.getElementById('loginBtn');
  const err = document.getElementById('loginError');
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value.trim();

  if (!username || !password) {
    err.textContent = '请输入学号和密码';
    return;
  }

  btn.disabled = true;
  btn.textContent = '登录中...';
  err.textContent = '';

  try {
    const resp = await fetch('/api/login', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({username, password})
    });
    const data = await resp.json();

    if (data.ok) {
      document.getElementById('loginPage').classList.add('hidden');
      document.getElementById('schedulePage').classList.remove('hidden');
      loadSchedule();
    } else {
      err.textContent = data.msg || '登录失败';
    }
  } catch(e) {
    err.textContent = '网络错误，请重试';
  } finally {
    btn.disabled = false;
    btn.textContent = '登 录';
  }
}

function doLogout() {
  sessionStorage.clear();
  location.reload();
}

async function loadSchedule() {
  const content = document.getElementById('scheduleContent');
  content.innerHTML = '<div class="loading"><div class="spinner"></div>获取课表中...</div>';

  try {
    const resp = await fetch('/api/schedule');
    const data = await resp.json();

    if (data.ok && data.courses.length > 0) {
      allCourses = data.courses;
      buildColorMap();
      renderWeekNav();
      renderSchedule(0);
    } else {
      content.innerHTML = `
        <div class="empty-state">
          <div class="emoji">📭</div>
          <p>${data.msg || '暂无课表数据'}</p>
        </div>`;
    }
  } catch(e) {
    content.innerHTML = `
      <div class="empty-state">
        <div class="emoji">⚠️</div>
        <p>加载失败: ${e.message}</p>
      </div>`;
  }
}

function buildColorMap() {
  const names = [...new Set(allCourses.map(c => c.name))];
  names.forEach((name, i) => {
    courseColorMap[name] = COLORS[i % COLORS.length];
  });
}

function renderWeekNav() {
  const nav = document.getElementById('weekNav');
  let maxWeek = 1;
  allCourses.forEach(c => {
    const parts = c.weeks.split('-');
    const end = parseInt(parts[parts.length-1]);
    if (end > maxWeek) maxWeek = end;
  });

  let html = '';
  for (let w = 1; w <= Math.min(maxWeek, 20); w++) {
    html += `<button class="week-btn${w===1?' active':''}" onclick="selectWeek(this, ${w-1})">第${w}周</button>`;
  }
  nav.innerHTML = html;
}

function selectWeek(el, dayOffset) {
  document.querySelectorAll('.week-btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  renderSchedule(dayOffset);
}

function renderSchedule(dayIndex) {
  const content = document.getElementById('scheduleContent');
  const today = new Date().getDay();
  const todayIdx = today === 0 ? 6 : today - 1;

  const periods = [
    {name: '上午', slots: [41,42,43,44,46]},
    {name: '下午', slots: [49,50,51,52]},
    {name: '晚上', slots: [56,57,58]},
  ];

  let html = '<div class="schedule-grid">';
  html += '<div class="day-header">';
  html += '<span class="corner"></span>';
  for (let d = 0; d < 7; d++) {
    const isToday = d === todayIdx;
    html += `<span class="${isToday?'today':''}">${DAYS[d]}</span>`;
  }
  html += '</div>';

  periods.forEach(period => {
    html += `<div class="period-section">`;
    html += `<div class="period-label">${period.name}</div>`;

    period.slots.forEach(slotId => {
      html += `<div class="slot-row">`;
      html += `<div class="slot-time">${SLOT_TIMES[slotId]||''}</div>`;

      for (let d = 0; d < 7; d++) {
        const dayNum = d + 1;
        const course = allCourses.find(c =>
          c.slot === slotId && c.day === dayNum
        );

        if (course) {
          const cls = courseColorMap[course.name] || 'c0';
          html += `<div class="course-cell ${cls}" onclick='showDetail(${JSON.stringify(course).replace(/'/g,"\\'")})'>`;
          html += `<div class="course-name">${course.name}</div>`;
          html += `<div class="course-room">${course.room}</div>`;
          html += `</div>`;
        } else {
          html += `<div class="course-cell empty"></div>`;
        }
      }
      html += `</div>`;
    });
    html += `</div>`;
  });

  html += '</div>';
  content.innerHTML = html;
}

function showDetail(course) {
  const modal = document.getElementById('modal');
  document.getElementById('modalName').textContent = course.name;

  const info = document.getElementById('modalInfo');
  info.innerHTML = `
    <div class="modal-row">
      <div class="modal-icon" style="background:rgba(108,92,231,0.2)">👨‍🏫</div>
      <div><div class="modal-label">授课教师</div><div class="modal-value">${course.teacher}</div></div>
    </div>
    <div class="modal-row">
      <div class="modal-icon" style="background:rgba(0,206,201,0.2)">📍</div>
      <div><div class="modal-label">教室</div><div class="modal-value">${course.room}</div></div>
    </div>
    <div class="modal-row">
      <div class="modal-icon" style="background:rgba(253,203,110,0.2)">🕐</div>
      <div><div class="modal-label">时间</div><div class="modal-value">${course.day_name} ${course.slot_name}</div></div>
    </div>
    <div class="modal-row">
      <div class="modal-icon" style="background:rgba(253,121,168,0.2)">📆</div>
      <div><div class="modal-label">周次</div><div class="modal-value">第 ${course.weeks} 周</div></div>
    </div>
  `;
  modal.classList.add('show');
}

function closeModal(e) {
  if (e.target === document.getElementById('modal')) {
    document.getElementById('modal').classList.remove('show');
  }
}

document.getElementById('password').addEventListener('keydown', e => {
  if (e.key === 'Enter') doLogin();
});
document.getElementById('username').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('password').focus();
});
</script>
</body>
</html>
